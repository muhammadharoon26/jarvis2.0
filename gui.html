<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Workspace Configurator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --surface: #161b22;
            --surface-hover: #21262d;
            --primary: #58a6ff;
            --primary-hover: #3182ce;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --danger: #f85149;
            --success: #238636;
            --success-hover: #2ea043;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        html, body { 
            height: 100%; margin: 0; padding: 0; overflow: hidden; 
            background: radial-gradient(circle at top right, #1f2937, var(--bg-color));
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; 
            color: var(--text-main); 
        }

        .wrapper { display: flex; justify-content: center; height: 100vh; padding: 20px; }

        .container { 
            width: 100%; max-width: 950px; 
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; height: 100%; 
            border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            overflow: hidden;
        }
        
        .scrollable-content { 
            flex: 1; overflow-y: auto; padding: 40px; 
            scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .scrollable-content::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .header-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; 
        }
        
        h1 { 
            font-size: 28px; margin: 0; font-weight: 800; 
            background: -webkit-linear-gradient(0deg, #58a6ff, #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; gap: 20px; align-items: center; }
        
        .toggle-label { 
            font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-main); transition: var(--transition);
        }
        .toggle-label:hover { color: #fff; }
        
        /* Modern Checkbox */
        .toggle-label input[type="checkbox"] { 
            appearance: none; width: 40px; height: 22px; background: var(--surface-hover); 
            border-radius: 20px; position: relative; cursor: pointer; outline: none; border: 1px solid var(--border);
            transition: var(--transition);
        }
        .toggle-label input[type="checkbox"]::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; 
            background: var(--text-muted); border-radius: 50%; transition: var(--transition);
        }
        .toggle-label input[type="checkbox"]:checked { background: var(--primary); border-color: var(--primary); }
        .toggle-label input[type="checkbox"]:checked::after { left: 20px; background: #fff; }

        .workspace-controls { 
            background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: var(--radius); 
            margin-bottom: 35px; display: flex; gap: 15px; align-items: center; border: 1px solid var(--border);
        }
        .workspace-controls select { 
            flex: 1; padding: 12px 15px; font-size: 16px; font-weight: 600; font-family: inherit;
            background: var(--surface); color: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); 
            outline: none; transition: var(--transition); appearance: none;
        }
        .workspace-controls select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2); }
        
        .btn {
            padding: 10px 18px; cursor: pointer; border: 1px solid transparent; border-radius: var(--radius-sm); 
            font-weight: 600; font-size: 14px; font-family: inherit; transition: var(--transition);
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-outline { background: transparent; color: var(--text-main); border-color: var(--border); }
        .btn-outline:hover { background: var(--surface-hover); color: #fff; border-color: var(--text-muted); }
        
        .btn-danger { color: #ff7b72; background: transparent; border-color: rgba(248, 81, 73, 0.4); }
        .btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

        .section { margin-bottom: 30px; animation: fadeIn 0.5s ease-out; }
        .section h2 { font-size: 18px; margin-top: 0; margin-bottom: 15px; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 10px;}
        .section h2::after { content: ''; flex: 1; height: 1px; background: var(--border); margin-left: 10px; }
        
        .row { 
            display: flex; gap: 12px; margin-bottom: 12px; align-items: center; 
            background: rgba(255, 255, 255, 0.02); padding: 12px; border: 1px solid var(--border); 
            border-radius: var(--radius-sm); transition: var(--transition);
        }
        .row:hover { border-color: var(--text-muted); background: rgba(255, 255, 255, 0.04); transform: translateX(4px); }
        
        input[type="text"], select { 
            flex: 1; padding: 10px 15px; border: 1px solid var(--border); border-radius: var(--radius-sm); 
            background: var(--bg-color); color: #fff; font-family: inherit; transition: var(--transition); outline: none;
        }
        input[type="text"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2); }
        input[type="text"]::placeholder { color: var(--text-muted); }
        
        .btn-add { 
            background: rgba(88, 166, 255, 0.1); color: var(--primary); width: 100%; border: 1px dashed var(--primary); 
            padding: 12px; margin-top: 5px; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 600;
            transition: var(--transition);
        }
        .btn-add:hover { background: rgba(88, 166, 255, 0.2); color: #fff; }
        
        .btn-remove { 
            background: transparent; color: var(--text-muted); padding: 8px; width: 36px; height: 36px; 
            display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); border: none; cursor: pointer;
            transition: var(--transition); font-weight: bold;
        }
        .btn-remove:hover { background: rgba(248, 81, 73, 0.1); color: var(--danger); }

        .action-bar { 
            padding: 25px 40px; background: rgba(13, 17, 23, 0.9); border-top: 1px solid var(--border); 
            display: flex; justify-content: space-between; gap: 20px; backdrop-filter: blur(10px);
        }
        
        .btn-save { background: var(--success); color: white; font-size: 16px; padding: 16px 24px; flex: 1; border: none; border-radius: var(--radius); font-weight: 600; box-shadow: 0 4px 14px 0 rgba(35, 134, 54, 0.39); }
        .btn-launch { background: var(--primary); color: white; font-size: 16px; padding: 16px 24px; flex: 1; border: none; border-radius: var(--radius); font-weight: 600; box-shadow: 0 4px 14px 0 rgba(88, 166, 255, 0.39); }
        .btn-save:hover { background: var(--success-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(35, 134, 54, 0.5); }
        .btn-launch:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(88, 166, 255, 0.5); }
        
        .checkbox-wrap { display: flex; align-items: center; gap: 8px; color: var(--text-main); font-size: 14px; cursor: pointer; user-select: none; }
        .checkbox-wrap input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="scrollable-content">
                <div class="header-bar">
                    <h1>Jarvis Manager 2.0</h1>
                    <div class="header-actions">
                        <label class="toggle-label" title="Start automatically with Windows">
                            <input type="checkbox" id="startup-toggle" onchange="toggleStartup()">
                            Run on Startup
                        </label>
                        <button class="btn btn-outline" onclick="window.pywebview.api.open_logs()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            Logs
                        </button>
                    </div>
                </div>

                <div class="workspace-controls">
                    <select id="workspace-dropdown" onchange="switchWorkspace(this.value)"></select>
                    <button class="btn btn-outline" onclick="createWorkspace()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        New
                    </button>
                    <button class="btn btn-outline" onclick="renameWorkspace()">Rename</button>
                    <button class="btn btn-danger" onclick="deleteWorkspace()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>

                <div class="section" id="folders-section">
                    <h2>📂 Folders</h2>
                    <div id="folders-container"></div>
                    <button class="btn-add" onclick="addFolder()">+ Add Folder</button>
                </div>
                
                <div class="section" id="urls-section">
                    <h2>🌐 Websites</h2>
                    <div id="urls-container"></div>
                    <button class="btn-add" onclick="addUrl()">+ Add Website</button>
                </div>
                
                <div class="section" id="apps-section">
                    <h2>🚀 Applications</h2>
                    <div id="apps-container"></div>
                    <button class="btn-add" onclick="addApp()">+ Add App</button>
                </div>
                
                <div class="section" id="terminals-section">
                    <h2>💻 Terminal Tabs</h2>
                    <div id="terminals-container"></div>
                    <button class="btn-add" onclick="addTerminal()">+ Add Terminal Tab</button>
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-save" onclick="saveToDisk()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    Save Config
                </button>
                <button class="btn btn-launch" onclick="launchJarvis()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Launch Workspace
                </button>
            </div>
        </div>
    </div>

    <script>
        let workspaces = {};
        let activeWs = "";
        const emptyWs = () => ({ folders: [], urls: [], apps: [], terminals: [] });

        const cleanPath = (val) => val ? val.trim().replace(/^"|"$/g, '') : "";

        function toggleStartup() {
            const isEnabled = document.getElementById('startup-toggle').checked;
            window.pywebview.api.toggle_startup(isEnabled).then(response => console.log(response));
        }

        function updateDropdown() {
            const dropdown = document.getElementById('workspace-dropdown');
            dropdown.innerHTML = '';
            Object.keys(workspaces).forEach(name => {
                const opt = document.createElement('option'); opt.value = name; opt.innerText = name; dropdown.appendChild(opt);
            });
            dropdown.value = activeWs;
        }

        function switchWorkspace(name) { if (activeWs) saveCurrentToMemory(); activeWs = name; renderActiveWorkspace(); }
        
        function createWorkspace() { 
            const name = prompt("Enter name for new workspace:"); 
            if (name && !workspaces[name]) { 
                if (activeWs) saveCurrentToMemory(); 
                workspaces[name] = emptyWs(); 
                activeWs = name; 
                updateDropdown(); 
                renderActiveWorkspace(); 
            } 
        }
        
        function renameWorkspace() { 
            if (!activeWs) return; 
            const newName = prompt("Rename workspace:", activeWs); 
            if (newName && newName !== activeWs && !workspaces[newName]) { 
                saveCurrentToMemory(); 
                workspaces[newName] = workspaces[activeWs]; 
                delete workspaces[activeWs]; 
                activeWs = newName; 
                updateDropdown(); 
            } 
        }
        
        function deleteWorkspace() { 
            if (Object.keys(workspaces).length <= 1) { 
                alert("You must have at least one workspace."); return; 
            } 
            if (confirm(`Are you sure you want to delete '${activeWs}'?`)) { 
                delete workspaces[activeWs]; 
                activeWs = Object.keys(workspaces)[0]; 
                updateDropdown(); 
                renderActiveWorkspace(); 
            } 
        }

        function saveCurrentToMemory() {
            if (!activeWs) return;
            const config = { folders: [], urls: [], apps: [], terminals: [] };
            document.querySelectorAll('.folder-input').forEach(el => { if (el.value) config.folders.push(cleanPath(el.value)); });
            document.querySelectorAll('.url-input').forEach(el => { if (el.value) config.urls.push(cleanPath(el.value)); });
            document.querySelectorAll('#apps-container .row').forEach(row => {
                const path = row.querySelector('.app-path').value;
                if (path) config.apps.push({ path: cleanPath(path), args: cleanPath(row.querySelector('.app-args').value), run_as_admin: row.querySelector('.app-admin').checked });
            });
            document.querySelectorAll('#terminals-container .row').forEach(row => {
                const path = row.querySelector('.term-path').value;
                if (path) config.terminals.push({ path: cleanPath(path), profile: row.querySelector('.term-profile').value, venv: row.querySelector('.term-venv').checked });
            });
            workspaces[activeWs] = config;
        }

        function renderActiveWorkspace() {
            document.getElementById('folders-container').innerHTML = ''; document.getElementById('urls-container').innerHTML = '';
            document.getElementById('apps-container').innerHTML = ''; document.getElementById('terminals-container').innerHTML = '';
            const data = workspaces[activeWs] || emptyWs();
            if(data.folders.length) data.folders.forEach(f => addFolder(f)); else addFolder();
            if(data.urls.length) data.urls.forEach(u => addUrl(u)); else addUrl();
            if(data.apps.length) data.apps.forEach(a => addApp(a.path, a.args, a.run_as_admin)); else addApp();
            if(data.terminals.length) data.terminals.forEach(t => addTerminal(t.path, t.profile, t.venv)); else addTerminal();
        }

        function addFolder(val = "") { 
            const div = document.createElement('div'); div.className = 'row'; 
            div.innerHTML = `<input type="text" placeholder="Folder path... (e.g. C:\\Projects)" class="folder-input" value="${val}"> <button class="btn-remove" onclick="this.parentElement.remove()" title="Remove">✕</button>`; 
            document.getElementById('folders-container').appendChild(div); 
        }
        
        function addUrl(val = "") { 
            const div = document.createElement('div'); div.className = 'row'; 
            div.innerHTML = `<input type="text" placeholder="https://..." class="url-input" value="${val}"> <button class="btn-remove" onclick="this.parentElement.remove()" title="Remove">✕</button>`; 
            document.getElementById('urls-container').appendChild(div); 
        }
        
        function addApp(path = "", args = "", admin = false) { 
            const div = document.createElement('div'); div.className = 'row'; 
            div.innerHTML = `
                <input type="text" placeholder="App .exe path" class="app-path" value="${path}"> 
                <input type="text" placeholder="Arguments (optional)" class="app-args" value="${args}"> 
                <label class="checkbox-wrap"><input type="checkbox" class="app-admin" ${admin ? 'checked' : ''}> Admin</label> 
                <button class="btn-remove" onclick="this.parentElement.remove()" title="Remove">✕</button>
            `; 
            document.getElementById('apps-container').appendChild(div); 
        }
        
        function addTerminal(path = "", profile = "Windows PowerShell", venv = false) { 
            const div = document.createElement('div'); div.className = 'row'; 
            div.innerHTML = `
                <input type="text" placeholder="Start Directory" class="term-path" value="${path}"> 
                <select class="term-profile">
                    <option value="Windows PowerShell" ${profile === 'Windows PowerShell' ? 'selected' : ''}>PowerShell</option>
                    <option value="Command Prompt" ${profile === 'Command Prompt' ? 'selected' : ''}>CMD</option>
                </select> 
                <label class="checkbox-wrap" title="Auto-activate local .venv"><input type="checkbox" class="term-venv" ${venv ? 'checked' : ''}> .venv</label> 
                <button class="btn-remove" onclick="this.parentElement.remove()" title="Remove">✕</button>
            `; 
            document.getElementById('terminals-container').appendChild(div); 
        }

        function saveToDisk() { 
            saveCurrentToMemory(); 
            window.pywebview.api.save_config(workspaces).then(response => {
                // Show a modern brief notification instead of alert
                const btn = document.querySelector('.btn-save');
                const origHtml = btn.innerHTML;
                btn.innerHTML = '✓ Saved!';
                btn.style.background = '#2ea043';
                setTimeout(() => { btn.innerHTML = origHtml; btn.style.background = ''; }, 2000);
            }); 
        }
        
        function launchJarvis() { 
            saveCurrentToMemory(); 
            window.pywebview.api.launch_workspace(activeWs).then(response => console.log(response)); 
            
            // Visual feedback
            const btn = document.querySelector('.btn-launch');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '🚀 Launching...';
            setTimeout(() => { btn.innerHTML = origHtml; }, 2000);
        }

        window.addEventListener('pywebviewready', function() {
            window.pywebview.api.check_startup().then(isEnabled => {
                document.getElementById('startup-toggle').checked = isEnabled;
            });

            window.pywebview.api.load_config().then(data => {
                if (Object.keys(data).length === 0 || !data) { workspaces = { "Default Workspace": emptyWs() }; }
                else { workspaces = data; }
                activeWs = Object.keys(workspaces)[0];
                updateDropdown(); renderActiveWorkspace();
            });
        });
    </script>
</body>
</html>
